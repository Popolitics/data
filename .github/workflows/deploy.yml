name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'job/**'
      - 'flows/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  pull_request:

concurrency:
  group: deploy-kestra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Préparer le nom de l'image
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build et publication de l'image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Checkout du dépôt infra
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Popolitics/infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
          ref: feat/AUTH-1-init-argocd-integration-and-auth-service

      - name: Mise à jour sécurisée du tag Kustomize
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd infra/k8s/base/kestra
          
          # 1. Ciblage strict de l'image kestra via yq
          IMAGE_NAME="${{ steps.image.outputs.name }}"
          yq eval "(.images[] | select(.name == \"$IMAGE_NAME\")).newTag = \"${{ github.sha }}\"" -i kustomization.yaml

          # 2. Commit idempotent
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(kestra): update image tag to ${{ github.sha }}"
            git push
          else
            echo "Aucun changement de tag détecté, étape ignorée."
          fi